[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Each connection returns to the pool when its transaction ends.
pool_mode = transaction
default_pool_size = 5
max_client_conn = 100

# Fail fast when Postgres is down, so /health/ doesn't hang.
query_wait_timeout = 5

stats_users = notifications
