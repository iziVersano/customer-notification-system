[project]
name = "customer-notification-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django~=5.2.0",
    "psycopg[binary]~=3.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only the dependencies get installed. The code runs from /app.
[tool.setuptools]
py-modules = []
